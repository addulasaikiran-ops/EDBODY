name: Build EDBODY desktop app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run backend tests
        run: python -m pytest -q

  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Configure Electron sandbox helper for startup check
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Linux desktop startup smoke test
        if: runner.os == 'Linux'
        run: npm run smoke:linux
      - name: Restore sandbox helper ownership
        if: always() && runner.os == 'Linux'
        run: |
          sudo chown "$(id -u):$(id -g)" node_modules/electron/dist/chrome-sandbox
          chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Package desktop application
        run: npm run dist
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edbody-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
