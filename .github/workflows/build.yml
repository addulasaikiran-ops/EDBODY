name: Build EDBODY desktop app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-tests:
    name: Python backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run backend tests
        run: python -m pytest -q

  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Bootstrap lockfile on request branch
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/chore/generate-npm-lockfile'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c chore/generated-npm-lockfile
          git add package-lock.json
          git commit -m "build: generate npm lockfile"
          git push origin HEAD:refs/heads/chore/generated-npm-lockfile
      - name: Unit tests (demo behavior only)
        run: npm test
      - name: Package desktop application
        run: npm run dist
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edbody-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
